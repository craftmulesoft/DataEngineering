version: 2

models:

  - name: dim_customers
    description: >
      Customer dimension containing descriptive customer information used
      for reporting and business analysis.

    columns:

      - name: customer_id
        description: Unique customer identifier.
        tests:
          - unique
          - not_null

      - name: customer_name
        description: Customer full name.
        tests:
          - not_null
      - name: email
        description: Customer email address.

      - name: city
        description: Customer city.

      - name: country
        description: Customer country.

  - name: dim_products
    description: >
      Product dimension containing descriptive information about products,
      categories, and pricing for analytical reporting.


    columns:

      - name: product_id
        description: Unique product identifier.
        tests:
          - unique
          - not_null
      - name: product_name
        description: Product name.

      - name: category
        description: Product category.
      - name: product_price
        description: Product selling price.
        tests:
          - not_null

  - name: fact_sales
    description: >
      Central fact table that stores sales transactions at the order item
      level. Each record represents a purchased product within an order and
      contains measurable business metrics for reporting and analysis.

    columns:

      - name: order_id
        description: Sales order identifier.
        tests:
          - not_null

      - name: quantity
        description: Number of units purchased for the product in the order.
        tests:
          - not_null

      - name: customer_id
        description: Foreign key referencing the customer dimension.
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: product_id
        description: Foreign key referencing the product dimension.
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: revenue
        description: Total revenue generated by the order line.

      - name: order_date
        description: Date the order was placed.
  
  - name: mart_customer_sales
    description: >
      Analytical summary table that aggregates sales performance by customer,
      including revenue, order counts, products purchased, and average order value.

  - name: mart_product_sales
    description: >
      Analytical summary table that aggregates sales performance by product,
      including total revenue and units sold.