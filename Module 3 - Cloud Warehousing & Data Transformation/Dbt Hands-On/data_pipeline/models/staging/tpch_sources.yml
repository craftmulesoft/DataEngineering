version: 2

sources:
    - name: tpch
      database: SNOWFLAKE_SAMPLE_DATA
      schema: TPCH_SF1
      tables:
        - name: orders
          columns:
            - name: o_orderkey
              tests:
                - not_null
                - unique
        - name: lineitem
          columns:
            - name: l_orderkey
              tests:
                - relationships:
                    to: source('tpch', 'orders')
                    field: o_orderkey

      