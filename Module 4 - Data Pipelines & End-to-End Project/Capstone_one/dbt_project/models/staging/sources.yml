version: 2

sources:
  - name: raw
    description: >
      Raw layer containing product data extracted directly from the Fake Store API.
      This data is loaded into Snowflake without any business transformations and
      serves as the foundation for downstream dbt models.

    database: CAPSTONE_ECOMMERCE_DB
    schema: RAW

    tables:
      - name: products
        description: >
          Raw products table containing product details, pricing information,
          category, image URL, and customer rating metrics loaded from the API.